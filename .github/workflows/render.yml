name: Render Short YouTube

on:
  workflow_dispatch:
    inputs:
      payload_json:
        description: 'JSON con las escenas y audio de n8n'
        required: true

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Instalar herramientas de sistema (FFmpeg y dependencias de Puppeteer)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgbm-dev

      - name: 4. Instalar dependencias del proyecto
        run: npm install

      - name: 5. Guardar payload recibido desde n8n
        run: curl -s -L "${{ github.event.inputs.payload_json }}" > payload.json

      - name: 6. Ejecutar motor de renderizado (render.js)
        run: npm run render

      - name: 7. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 8. Instalar dependencias de Python para YouTube
        run: pip install google-auth-oauthlib google-api-python-client requests

      - name: 9. Subir y programar vídeo en YouTube a las 18:00
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          # Extraemos dinámicamente el título del payload generado por la IA
          TITULO_SHORT=$(node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync('payload.json', 'utf8')); console.log(data.tema_titulo || 'Psicología Fascinante');")
          
          echo "Título detectado: $TITULO_SHORT"
          
          # Pasamos el título extraído como argumento al script de Python
          python upload.py output.mp4 "$TITULO_SHORT"

      - name: 10. Enviar aviso informativo a Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CLEAN_TOKEN=$(echo "$TELEGRAM_TOKEN" | tr -d '[:space:]')
          CLEAN_CHAT_ID=$(echo "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')

          curl -v -F chat_id="$CLEAN_CHAT_ID" \
               -F video=@output.mp4 \
               -F caption="🕒 ¡Short renderizado, subido y programado automáticamente para las 18:00 con su título optimizado!" \
               "https://api.telegram.org/bot$CLEAN_TOKEN/sendVideo"
