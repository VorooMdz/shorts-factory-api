name: Render & Upload Short v2.0

on:
  workflow_dispatch:
    inputs:
      payload_json:
        description: 'URL del JSON con el payload del short'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies (FFmpeg & Puppeteer deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 pango-1.0

      - name: Install Node modules
        run: npm install

      - name: Install Python dependencies
        run: pip install google-auth-oauthlib google-auth-httplib2 google-api-python-client requests

      - name: Download payload and run renderer
        env:
          PAYLOAD_URL: ${{ github.event.inputs.payload_json }}
        run: |
          node render.js "$PAYLOAD_URL"

      - name: Upload to YouTube via Python script
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python upload.py

      - name: Auto-Registro Post-Subida en historial_temas.json
        if: success()
        run: |
          node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync("payload.json", "utf8"));
            let hist = [];
            if (fs.existsSync("historial_temas.json")) {
              try { hist = JSON.parse(fs.readFileSync("historial_temas.json", "utf8")); } catch(e) { hist = []; }
            }
            if (!Array.isArray(hist)) hist = [];
            if (!hist.some(item => item.id_concepto === payload.id_concepto)) {
              hist.push({
                id_concepto: payload.id_concepto,
                subrama: payload.subrama || "Psicología",
                titulo: payload.tema_titulo || payload.TituloYT,
                keywords_concepto: payload.keywords_concepto || [],
                fecha_publicacion: new Date().toISOString()
              });
              fs.writeFileSync("historial_temas.json", JSON.stringify(hist, null, 2));
            }
          '
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historial_temas.json
          git diff --staged --quiet || (git commit -m "chore: auto-registro tema publicado en historial_temas.json [skip ci]" && git push)
