name: Renderizar y Subir Short

on:
  workflow_dispatch:
  repository_dispatch:
    types: [render-video]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js y Caché
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Instalar FFmpeg estático y dependencias de Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev libasound2t64 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 libnss3 libxshmfence1 curl || sudo apt-get install -y libgbm-dev libasound2 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 libnss3 libxshmfence1 curl
          curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          sudo mv ffmpeg*-static/ffmpeg /usr/local/bin/
          sudo mv ffmpeg*-static/ffprobe /usr/local/bin/
          rm -rf ffmpeg*

      - name: 4. Instalar librerías del proyecto (Node y Python)
        run: |
          npm install
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 requests

      - name: 5. Descargar payload.json desde Gist y Renderizar Vídeo
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "📥 Descargando payload.json desde Gist..."
          curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/gists/$GIST_ID" > gist_response.json
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('gist_response.json', 'utf8'));
            if (!data.files || !data.files['payload.json']) {
              console.error('❌ No se encontró payload.json en el Gist:', data.message || data);
              process.exit(1);
            }
            const fileObj = data.files['payload.json'];
            if (fileObj.truncated && fileObj.raw_url) {
              console.log('🔗 Archivo grande, descargando desde raw_url...');
              const { execSync } = require('child_process');
              execSync(\`curl -s -L \"\${fileObj.raw_url}\" -o payload.json\`);
            } else {
              fs.writeFileSync('payload.json', fileObj.content);
            }
            console.log('✅ payload.json guardado correctamente.');
          "
          node render.js

      - name: 6. Subir a YouTube y Notificar por Telegram
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 upload.py output.mp4
