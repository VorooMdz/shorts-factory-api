name: Render & Upload Short v2.0

on:
  workflow_dispatch:
    inputs:
      payload_json:
        description: 'URL del JSON con el payload del short'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies (FFmpeg & Puppeteer deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 pango-1.0

      - name: Install Node modules
        run: npm install

      - name: Install Python dependencies
        run: pip install google-auth-oauthlib google-auth-httplib2 google-api-python-client requests

      - name: Download payload and run renderer
        env:
          PAYLOAD_URL: ${{ github.event.inputs.payload_json }}
        run: |
          node render.js "$PAYLOAD_URL"

      - name: Upload to YouTube via Python script
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python upload.py
